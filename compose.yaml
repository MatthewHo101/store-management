name: coffee-management
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ember
      POSTGRES_PASSWORD: ember_dev_only
      POSTGRES_DB: ember
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      - coffee-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ember -d ember']
      interval: 2s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment: &app-environment
      DATABASE_URL: postgresql://ember:ember_dev_only@db:5432/ember
      HOST: 0.0.0.0
      PORT: 3000
      BUSINESS_NAME: coffee-management
      CURRENCY: USD
    command: ['sh', '-c', 'node dist/cli.js migrate && node dist/server.js']
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    build: .
    environment: *app-environment
    command: ['node', 'dist/worker.js']
    depends_on:
      api:
        condition: service_healthy
  test:
    profiles: ['tools']
    build:
      context: .
      target: build
    environment:
      TEST_DATABASE_URL: postgresql://ember:ember_dev_only@db:5432/ember_test
    command: ['npm', 'run', 'check']
    depends_on:
      db:
        condition: service_healthy
volumes:
  coffee-data:
    # Keep the existing database volume when upgrading from the original project name.
    name: ember-coffee_coffee-data
